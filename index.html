<body>
<div id="bg"></div>

<div id="ui" class="ui-b">
  <select id="pick" aria-label="flower">
    <option value="glass-hibiscus" selected>Hibiscus · glass</option>
    <option value="prism-peony">Peony · prism</option>
    <option value="pearl-rose">Rose · pearl</option>
    <option value="holo-rose">Rose · hologram</option>
    <option value="gold-bloom">Bloom · gold night</option>
    <option value="jade-lotus">Lotus · jade</option>

    <option value="emerald-orchid">Orchid · emerald</option>
    <option value="blossom-drift">Cherry blossom · drift</option>
    <option value="queen-of-night">Queen of the Night · moon</option>
    <option value="jasmine">Jasmine · moonlight</option>

  </select>
  <div class="bar">
    <div id="menu">
      <div id="menulist" role="listbox"></div>

    </div>

</div>
<div id="keypanel">
  <div>uses <b>your own</b> openai key — it stays in this browser, goes only to openai. ~$0.05 per flower.</div>
  <input id="keyin" type="password" placeholder="sk-…" spellcheck="false" autocomplete="off">
  <label id="keyrow"><input id="keyremember" type="checkbox"> remember on this device</label>
  <div id="keybtns">
    <button id="keysave" type="button">plant the key</button>
    <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">get a key ↗</a>
    <button id="keyforget" type="button" style="display:none">forget my key</button>
  </div>

<script>
const IMAGES = {"glass-hibiscus": "tex/glass-hibiscus.jpg","prism-peony": "tex/prism-peony.jpg","pearl-rose": "tex/pearl-rose.jpg","holo-rose": "tex/holo-rose.jpg","gold-bloom": "tex/gold-bloom.jpg","jade-lotus": "tex/jade-lotus.jpg","scarlet-poppy": "tex/scarlet-poppy.jpg","emerald-orchid": "tex/emerald-orchid.jpg","blossom-drift": "tex/blossom-drift.jpg","queen-of-night": "tex/queen-of-night.jpg","jasmine": "tex/jasmine.jpg","dandelion": "tex/dandelion.jpg"};
const VS = `attribute vec2 aP; varying vec2 vUv;
void main(){ vUv = aP*.5+.5; gl_Position = vec4(aP,0.,1.); }`;
const FS = `
precision highp float;
const int NR = 48;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2  uRes, uTexRes;
uniform float uTime;
uniform vec4  uRipples[NR];
uniform float uCount, uMotion;
uniform vec3  uGrade;
uniform float uGradeAmt;

float hash21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  float a = hash21(i), b = hash21(i+vec2(1,0)), c = hash21(i+vec2(0,1)), d = hash21(i+vec2(1,1));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
float fbm(vec2 p){
  float v = 0., a = .5;
  mat2 m = mat2(1.6,1.2,-1.2,1.6);
  for (int i = 0; i < 4; i++){ v += a*vnoise(p); p = m*p; a *= .5; }
  return v;
}
vec2 rippleField(vec2 p){
  vec2 disp = vec2(0.);
  for (int i = 0; i < NR; i++){
    if (float(i) >= uCount) break;
    vec4 rp = uRipples[i];
    if (rp.w <= 0.001) continue;
    float age = uTime - rp.z;
    if (age < 0.) continue;
    vec2 dv = p - rp.xy;
    float dist = length(dv) + 1e-4;
    float wave = sin(dist*26. - age*7.);
    float damp = exp(-age*1.4) * exp(-dist*2.8);
    disp += (dv/dist) * wave * damp * rp.w;
  }
  return disp;
}
void main(){
  vec2 uv = (vUv - .5) * vec2(uRes.x/uRes.y, 1.) * 2.;

  // photo stays vertical, stretched across the full screen;
  // slight overscan so the liquid warp never reveals the image edge
  // cover-fit: fill the frame, keep the photo's true proportions
  float sA = uRes.x/uRes.y, tA = uTexRes.x/uTexRes.y;
  vec2 tuv = vUv - .5;
  if (sA > tA) tuv.y *= tA/sA; else tuv.x *= sA/tA;
  tuv = (tuv + .5)*(1.-2.*.04) + .04;

  vec2 rd = rippleField(uv);
  float n1 = fbm(uv*2.0 + uTime*.055);
  float n2 = fbm(uv*2.0 - uTime*.045 + 7.);
  vec2 amb = (vec2(n1, n2) - .5) * .012 * uMotion;
  vec2 suv = tuv + clamp(rd*.55 + amb, vec2(-.038), vec2(.038));
  vec3 col = texture2D(uTex, suv).rgb;

  // color grade: re-dye the photo, keeping its light and shadow
  float glum = dot(col, vec3(.299,.587,.114));
  vec3 dye = uGrade * mix(glum, pow(glum,.75), .5) * 1.35;
  col = mix(col, dye, uGradeAmt);

  float bend = length(rd);
  col += vec3(.85,.92,1.) * bend * 2.6;
  col += vec3(1.,.95,.9) * pow(bend*8., 2.) * .10;

  float lum = dot(col, vec3(.333));
  // glitter is suspended IN the water: it drifts with the current
  // and gets swept along by the mouse ripples
  vec2 gdrift = (vec2(n2, n1) - .5) * .24 * uMotion;
  vec2 guv = uv + rd*1.8 + gdrift;
  vec2 gp = guv*46.;
  vec2 cell = floor(gp), fc = fract(gp) - .5;
  float gh = hash21(cell);
  float tw = .5 + .5*sin(uTime*2.4 + gh*44.);
  float glint = smoothstep(.955,1.,gh) * pow(tw,5.);
  float star = (1.-smoothstep(.0,.05,abs(fc.x))) + (1.-smoothstep(.0,.05,abs(fc.y)));
  float dotc = 1.-smoothstep(.05,.16,length(fc));
  // ripples also make the glitter flare up as it catches the light

      if (!r.ok) throw new Error(j.error || 'generation failed');
      slug = j.slug;
    } else if (!byokKey){
      // the shared garden: free, one new flower a day, cached for everyone
      const j = await gardenGrow(name);
      slug = j.slug;
      IMAGES[slug] = j.url;
      try {
        const mine = JSON.parse(localStorage.getItem('lg_mine') || '{}');
        mine[slug] = j.url;
        localStorage.setItem('lg_mine', JSON.stringify(mine));
      } catch(e){}
    } else {
      slug = slugify(name);
      if (!slug) throw new Error('give the flower a name');
      if (!IMAGES[slug]){
        if (!(await validateWithKey(name)))
          throw new Error(`"${name}" is not a flower we know — try a real flower name`);
        const url = await shrink(await generateWithKey(name));
        IMAGES[slug] = url;
        idbPut(slug, url).catch(() => {});
      }
    }
    addGrownOption(slug, true);
    pickEl.value = slug;
    loadTex(slug);
    say(labelFor(slug).toLowerCase() + ' has bloomed — it now lives in the menu');
  } catch(err){
    const m = String(err.message || err).toLowerCase();
    if (m.includes('not a flower') || m.includes('name a real flower')) refuse(m.slice(0, 70));
    else say(m.slice(0, 70));
  }
  growIn.classList.remove('busy');
  document.getElementById('ui').classList.remove('growing');
  growIn.placeholder = ph;
  growIn.disabled = false;
});

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const t0 = performance.now();
function frame(){
  now = (performance.now() - t0)/1000;
  if (ready){
    gl.viewport(0, 0, cv.width, cv.height);
    for (let i = live.length - 1; i >= 0; i--) if (now - live[i].t > 3.2) live.splice(i, 1);
    while (live.length > NR) live.shift();
    for (let i = 0; i < live.length; i++){
      ripples[i*4] = live[i].x; ripples[i*4+1] = live[i].y;
      ripples[i*4+2] = live[i].t; ripples[i*4+3] = live[i].amp;
    }
    gl.uniform2f(U.uRes, cv.width, cv.height);
    gl.uniform2f(U.uTexRes, texW, texH);
    gl.uniform1f(U.uTime, now);
    gl.uniform4fv(U.uRipples, ripples);
    gl.uniform1f(U.uCount, live.length);
    gl.uniform1f(U.uMotion, REDUCED ? 0 : 1);
    gl.uniform1i(U.uTex, 0);
    const gk = .04;
    gradeAmt += (gradeAmtTgt - gradeAmt)*gk;
    for (let i = 0; i < 3; i++) grade[i] += (gradeTgt[i] - grade[i])*gk;
    gl.uniform3f(U.uGrade, grade[0], grade[1], grade[2]);
    gl.uniform1f(U.uGradeAmt, gradeAmt);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
}
frame();
</script>
